version: "3.9"
services:
  app:
    build: .
    container_name: top-game-sorter
    volumes:
      - ./data:/app/data   # SQLite persistence
    environment:
      - MONGO_URI=mongodb://mongo:27017/top_game_db
      - SQLITE_PATH=/app/data/games.db
    depends_on:
      - mongo
    command: python src/generator/runner.py

  mongo:
    image: mongo:6.0
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db   # Mongo persistence

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo